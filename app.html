<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Veylo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./fonts/inter/inter.css">
    <style>
        :root {
            --bg: #0e0f11;
            --side: #0a0b0c;
            --col: #131417;
            --card: #1a1b1f;
            --cardh: #202126;
            --line: #25272c;
            --line2: #34363c;
            --tx: #e9eaec;
            --mu: #8b8f98;
            --dim: #5d616a;
            --acc: #5e6ad2;
            --accbg: rgba(94, 106, 210, .22);
            --hov: rgba(127, 127, 138, .11);
            --on: rgba(127, 127, 138, .18);
            --red: #e5484d;
            --yel: #f0b429;
            --shadow: 0 16px 48px rgba(0, 0, 0, .55);
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) {
                --bg: #fff;
                --side: #f7f7f8;
                --col: #f4f5f6;
                --card: #fff;
                --cardh: #fafafb;
                --line: #e6e7ea;
                --line2: #d3d5da;
                --tx: #1b1c1f;
                --mu: #6a6e77;
                --dim: #9a9ea7;
                --accbg: rgba(94, 106, 210, .16);
                --hov: rgba(60, 60, 80, .06);
                --on: rgba(60, 60, 80, .1);
                --shadow: 0 16px 48px rgba(20, 20, 40, .18);
                color-scheme: light
            }
        }

        :root[data-theme="light"] {
            --bg: #fff;
            --side: #f7f7f8;
            --col: #f4f5f6;
            --card: #fff;
            --cardh: #fafafb;
            --line: #e6e7ea;
            --line2: #d3d5da;
            --tx: #1b1c1f;
            --mu: #6a6e77;
            --dim: #9a9ea7;
            --accbg: rgba(94, 106, 210, .16);
            --hov: rgba(60, 60, 80, .06);
            --on: rgba(60, 60, 80, .1);
            --shadow: 0 16px 48px rgba(20, 20, 40, .18);
            color-scheme: light
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            font-feature-settings: "cv11", "ss03";
            -webkit-font-smoothing: antialiased;
            overflow: hidden
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit
        }

        button {
            background: none;
            border: 0;
            cursor: pointer;
            padding: 0
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 1px
        }

        .app {
            display: grid;
            grid-template-columns: 244px minmax(0, 1fr);
            height: 100%;
            transition: grid-template-columns .24s cubic-bezier(.4, 0, .2, 1)
        }

        .app.collapsed {
            grid-template-columns: 0 minmax(0, 1fr)
        }

        .app.collapsed .side {
            visibility: hidden;
            transition: visibility 0s .24s
        }

        .side {
            background: var(--side);
            min-width: 0;
            overflow: hidden
        }

        .side-in {
            width: 244px;
            height: 100%;
            padding: 10px 8px;
            overflow: auto;
            border-right: 1px solid var(--line)
        }

        .sh {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px 8px;
            color: var(--mu);
            font-weight: 500
        }

        .ib {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            color: var(--mu);
            flex: none
        }

        .ib:hover {
            background: var(--on);
            color: var(--tx)
        }

        .bi {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 6px 5px 8px;
            border-radius: 6px;
            color: var(--mu);
            cursor: pointer;
            min-height: 30px
        }

        .bi:hover {
            background: var(--hov);
            color: var(--tx)
        }

        .bi.on {
            background: var(--on);
            color: var(--tx)
        }

        .bi .n {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 450
        }

        .bi .acts {
            display: none;
            gap: 2px
        }

        .bi:hover .acts,
        .bi:focus-within .acts {
            display: flex
        }

        @media (hover:none) {
            .bi.on .acts {
                display: flex
            }
        }

        .bi .ib {
            width: 22px;
            height: 22px
        }

        .bi .ib.del {
            width: auto;
            padding: 0 6px;
            color: var(--red);
            font-weight: 500;
            font-size: 12px
        }

        .sq {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            flex: none;
            display: grid;
            place-items: center;
            font-size: 10.5px;
            font-weight: 600;
            color: #fff
        }

        .ri {
            flex: 1;
            min-width: 0;
            background: var(--bg);
            border: 1px solid var(--acc);
            border-radius: 5px;
            padding: 2px 6px;
            outline: 0;
            box-shadow: 0 0 0 3px var(--accbg)
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0
        }

        .top {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 46px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            flex: none
        }

        .top b {
            font-weight: 550;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0
        }

        .top .cnt {
            color: var(--dim);
            white-space: nowrap
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--line2);
            background: var(--card);
            font-weight: 500;
            white-space: nowrap;
            flex: none
        }

        .btn:hover {
            background: var(--cardh)
        }

        .btn.pri {
            background: var(--acc);
            border-color: transparent;
            color: #fff
        }

        .btn.pri:hover {
            filter: brightness(1.1)
        }

        .btn.danger {
            color: var(--red);
            background: none;
            border-color: transparent
        }

        .btn.danger:hover {
            background: rgba(229, 72, 77, .12)
        }

        kbd {
            font: 500 11px Inter, system-ui, sans-serif;
            color: var(--mu);
            border: 1px solid var(--line2);
            border-radius: 4px;
            padding: 0 5px;
            line-height: 16px
        }

        .btn.pri kbd {
            color: #fff;
            border-color: rgba(255, 255, 255, .4)
        }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line2);
            border-radius: 6px;
            overflow: hidden;
            background: var(--card);
            flex: none
        }

        .seg button {
            width: 30px;
            height: 26px;
            display: grid;
            place-items: center;
            color: var(--mu)
        }

        .seg button:hover {
            color: var(--tx);
            background: var(--hov)
        }

        .seg button.on {
            background: var(--on);
            color: var(--tx)
        }

        .fchip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 6px 0 9px;
            border-radius: 12px;
            background: var(--accbg);
            border: 1px solid var(--acc);
            flex: none;
            max-width: 180px
        }

        .fchip:hover {
            filter: brightness(1.1)
        }

        .cols {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            overflow: auto
        }

        .col {
            width: 296px;
            flex: none;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--col);
            border-radius: 10px;
            padding: 6px;
            transition: box-shadow .15s
        }

        .col.over {
            box-shadow: inset 0 0 0 1px var(--acc)
        }

        .ch,
        .lh {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ch {
            padding: 4px 4px 8px 8px
        }

        .ch b,
        .lh b {
            font-weight: 550;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .ch .c,
        .lh .c {
            color: var(--dim)
        }

        .sp2 {
            flex: 1
        }

        .ch .ri,
        .lh .ri {
            flex: 1;
            width: 0
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            min-height: 28px;
            padding: 1px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 11px 10px;
            cursor: grab;
            transition: background .12s, border-color .12s, transform .12s
        }

        .card:hover {
            background: var(--cardh);
            border-color: var(--line2)
        }

        .card:active {
            transform: scale(.985);
            cursor: grabbing
        }

        .card.drag {
            display: none
        }

        .cid {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--dim);
            font-size: 11.5px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 2px
        }

        .card .t {
            word-break: break-word;
            font-weight: 450
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-top: 8px
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 20px;
            padding: 0 8px 0 7px;
            border-radius: 10px;
            border: 1px solid var(--line2);
            color: var(--mu);
            font-size: 11.5px;
            max-width: 120px;
            white-space: nowrap
        }

        .tag span {
            overflow: hidden;
            text-overflow: ellipsis
        }

        .tag:hover {
            color: var(--tx);
            border-color: var(--dim)
        }

        .tag.on {
            background: var(--accbg);
            border-color: var(--acc);
            color: var(--tx)
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: hsl(var(--h, 210) 65% 58%);
            flex: none;
            display: inline-block
        }

        .sp {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--mu);
            font-size: 11.5px;
            font-variant-numeric: tabular-nums
        }

        .due {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--mu);
            font-size: 11.5px;
            white-space: nowrap
        }

        .card .due {
            margin-left: auto
        }

        .due.od {
            color: var(--red)
        }

        .due.soon {
            color: var(--yel)
        }

        .due.dn {
            color: var(--dim)
        }

        .ghost {
            position: fixed;
            top: -1000px;
            left: 0;
            transform: rotate(2deg) scale(1.03);
            box-shadow: var(--shadow);
            border-color: var(--acc);
            background: var(--cardh)
        }

        .ind {
            flex: none;
            border: 1.5px dashed var(--acc);
            background: var(--accbg);
            border-radius: 8px;
            animation: slot .16s ease-out
        }

        @keyframes slot {
            from {
                height: 0;
                opacity: 0
            }
        }

        .land {
            animation: land .34s cubic-bezier(.2, .9, .3, 1.15)
        }

        @keyframes land {
            0% {
                transform: scale(1.05) rotate(1.5deg);
                box-shadow: var(--shadow)
            }

            100% {
                transform: none;
                box-shadow: 0 0 0 transparent
            }
        }

        .flash {
            animation: flash 1.6s ease-out
        }

        @keyframes flash {

            0%,
            35% {
                border-color: var(--acc);
                box-shadow: 0 0 0 3px var(--accbg)
            }

            100% {
                border-color: var(--line);
                box-shadow: 0 0 0 0 transparent
            }
        }

        .addb {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            height: 30px;
            padding: 0 8px;
            margin-top: 4px;
            border-radius: 6px;
            color: var(--mu)
        }

        .addb:hover {
            background: var(--hov);
            color: var(--tx)
        }

        .addcol {
            flex: none;
            width: 296px;
            height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px dashed var(--line2);
            color: var(--mu)
        }

        .addcol:hover {
            background: var(--hov);
            color: var(--tx);
            border-color: var(--dim)
        }

        .cp {
            width: 100%;
            margin-top: 6px;
            resize: none;
            background: var(--card);
            border: 1px solid var(--acc);
            border-radius: 8px;
            padding: 9px 11px;
            outline: 0;
            box-shadow: 0 0 0 3px var(--accbg);
            display: block
        }

        .hint {
            color: var(--dim);
            font-size: 11.5px;
            padding: 4px 4px 2px
        }

        .empty {
            margin: auto;
            text-align: center;
            display: grid;
            gap: 10px;
            justify-items: center;
            padding: 24px
        }

        .empty p {
            margin: 0;
            font-size: 15px;
            font-weight: 550
        }

        .empty span {
            color: var(--mu)
        }

        .lv {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 12px 16px 28px
        }

        .lvin {
            max-width: 960px;
            margin: 0 auto
        }

        .ls {
            margin-bottom: 8px
        }

        .lh {
            height: 34px;
            padding: 0 6px 0 10px;
            background: var(--col);
            border-radius: 8px;
            cursor: pointer
        }

        .lh:hover {
            box-shadow: inset 0 0 0 999px var(--hov)
        }

        .chev {
            color: var(--dim);
            transition: transform .15s;
            flex: none
        }

        .ls.closed .chev {
            transform: rotate(-90deg)
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 4px 8px 4px 6px;
            border-bottom: 1px solid var(--line);
            cursor: pointer
        }

        .row:hover {
            background: var(--hov)
        }

        .row .st {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            flex: none
        }

        .row .st:hover {
            background: var(--on)
        }

        .rid {
            color: var(--dim);
            font-size: 11.5px;
            font-variant-numeric: tabular-nums;
            flex: none;
            min-width: 48px
        }

        .rt {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 450
        }

        .row.dn .rt {
            color: var(--mu);
            text-decoration: line-through;
            text-decoration-color: var(--dim)
        }

        .rm {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: none
        }

        .lempty {
            padding: 10px 12px;
            color: var(--dim)
        }

        .ladd {
            padding: 2px 4px 0
        }

        .lac {
            margin-top: 4px;
            width: 100%
        }

        .ov {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .5);
            padding: 12px
        }

        .ov.pv {
            align-items: flex-start;
            padding-top: 14vh;
            z-index: 20;
            background: rgba(0, 0, 0, .45)
        }

        .dlg {
            width: min(600px, 100%);
            max-height: 88vh;
            overflow-y: auto;
            background: var(--card);
            border: 1px solid var(--line2);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 16px 18px 14px;
            animation: pop .14s ease-out
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.97)
            }
        }

        .dh {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px
        }

        .dh select {
            background: var(--col);
            border: 1px solid var(--line2);
            border-radius: 6px;
            height: 26px;
            padding: 0 6px
        }

        .mt {
            width: 100%;
            background: none;
            border: 0;
            outline: 0;
            font-size: 18px;
            font-weight: 600;
            padding: 2px 0;
            letter-spacing: -.01em
        }

        .md {
            width: 100%;
            min-height: 84px;
            background: none;
            border: 0;
            outline: 0;
            resize: vertical;
            color: var(--mu);
            padding: 6px 0 10px;
            line-height: 1.55
        }

        .md:focus {
            color: var(--tx)
        }

        .mrow {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid var(--line)
        }

        .ml {
            width: 78px;
            flex: none;
            color: var(--mu);
            line-height: 26px;
            font-weight: 500
        }

        .dw {
            display: flex;
            align-items: center;
            gap: 4px
        }

        input[type=date] {
            background: var(--col);
            border: 1px solid var(--line2);
            border-radius: 6px;
            height: 26px;
            padding: 0 8px;
            outline: 0
        }

        input[type=date]:focus {
            border-color: var(--acc)
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            flex: 1;
            min-width: 0;
            min-height: 26px
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 10px 0 8px;
            border-radius: 12px;
            border: 1px solid var(--line2);
            color: var(--mu);
            font-size: 12px
        }

        .chip:hover {
            color: var(--tx);
            border-color: var(--dim)
        }

        .chip.on {
            color: var(--tx);
            border-color: hsl(var(--h) 55% 55%/.65);
            background: hsl(var(--h) 60% 55%/.14)
        }

        .tin,
        .sain {
            background: none;
            border: 0;
            outline: 0;
            min-width: 0
        }

        .tin {
            height: 24px;
            width: 120px;
            padding: 0 4px
        }

        .msec {
            border-top: 1px solid var(--line);
            padding-top: 8px
        }

        .msh {
            display: flex;
            align-items: center;
            color: var(--mu);
            font-weight: 500;
            line-height: 26px
        }

        .msh em {
            font-style: normal;
            color: var(--dim);
            margin-left: 6px;
            font-weight: 400
        }

        .pbar {
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            margin: 4px 0 6px;
            overflow: hidden
        }

        .pbar i {
            display: block;
            height: 100%;
            background: var(--acc);
            transition: width .2s ease
        }

        .sr,
        .sadd {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            border-radius: 6px;
            padding: 0 2px
        }

        .sr:hover {
            background: var(--hov)
        }

        .sr .ck {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            flex: none;
            border-radius: 6px
        }

        .sr .si {
            flex: 1;
            min-width: 0;
            background: none;
            border: 0;
            outline: 0;
            height: 28px
        }

        .sr.dn .si {
            color: var(--dim);
            text-decoration: line-through
        }

        .sr .ib {
            opacity: 0
        }

        .sr:hover .ib,
        .sr:focus-within .ib {
            opacity: 1
        }

        @media (hover:none) {
            .sr .ib {
                opacity: 1
            }
        }

        .sadd {
            color: var(--mu)
        }

        .sain {
            flex: 1;
            height: 28px
        }

        .sadd .pl2 {
            width: 22px;
            display: grid;
            place-items: center;
            flex: none
        }

        .df {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line)
        }

        .pop {
            position: fixed;
            z-index: 30;
            min-width: 240px;
            max-width: 320px;
            background: var(--card);
            border: 1px solid var(--line2);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 5px;
            animation: pop .12s ease-out;
            overflow: auto
        }

        .mi {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 30px;
            padding: 0 9px;
            border-radius: 6px;
            text-align: left
        }

        .mi:hover {
            background: var(--hov)
        }

        .mi.red {

            const acts = [{ t: 'act', l: 'New board', k: 'nb', ic: I.plus }]; if (b0) { acts.push({ t: 'act', l: 'New card', k: 'nc', ic: I.plus }); acts.push({ t: 'act', l: S.view === 'board' ? 'Switch to list view' : 'Switch to board view', k: 'vw', ic: S.view === 'board' ? I.list : I.board }) }
            acts.push({ t: 'act', l: S.collapsed ? 'Show sidebar' : 'Hide sidebar', k: 'tg', ic: I.side });
            const bs = S.boards.map(b => ({ t: 'board', l: b.name, id: b.id }));
            if (!q) return [...bs.slice(0, 6), ...acts];
            const top = (a, n) => a.filter(o => o.m).sort((x, y) => y.m.sc - x.m.sc).slice(0, n).map(o => ({ ...o.x, idx: o.m.idx }));
            const cs = []; S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(x => {
                const cid = key(b) + '-' + x.num, tm = fz(q, x.title), im = fz(q, cid), dm = x.desc && fz(q, x.desc), tg = x.tags.map(id => { const o = tagOf(b, id); return o ? o.name : '' }).join(' '), gm = tg && fz(q, tg);
                const m = tm ? { sc: tm.sc + 10, idx: tm.idx } : im ? { sc: im.sc, idx: null } : gm ? { sc: gm.sc * .5, idx: null } : dm ? { sc: dm.sc * .4, idx: null } : null;
                cs.push({ x: { t: 'card', l: x.title, id: x.id, b: b.id, bn: b.name + (!tm && !im && gm ? ' (tag)' : !tm && !im && dm ? ' (description)' : ''), k: c.k, cid }, m })
            })));
            return [...top(bs.map(x => ({ x, m: fz(q, x.l) })), 5), ...top(cs, 8), ...top(acts.map(x => ({ x, m: fz(q, x.l) })), 3)]
        }
        function drawP() {
            const el = $('pl'); if (!el) return;
            if (!P.items.length) { el.innerHTML = `<div class="pe">No results for “${esc(P.q)}”. Try a card title, tag, board name, or card ID.</div>`; return }
            let h = '', g = ''; P.items.forEach((x, i) => {
                const gl = { board: 'Boards', card: 'Cards', act: 'Actions' }[x.t]; if (gl !== g) { g = gl; h += `<div class="pg">${gl}</div>` }
                const ic = x.t === 'board' ? `<span class="sq" style="background:hsl(${hue(x.id)} 45% 46%)">${esc((x.l[0] || 'B').toUpperCase())}</span>` : x.t === 'card' ? (I[x.k] || I.t) : x.ic;
                h += `<div class="pi${i === P.i ? ' on' : ''}" role="option" data-a="pr" data-i="${i}"><span class="pic">${ic}</span>${x.t === 'card' ? `<span class="pid">${x.cid}</span>` : ''}<span class="pt">${hl(x.l, x.idx)}</span><span class="pm">${x.t === 'card' ? esc(x.bn) : ''}</span></div>`
            });
            el.innerHTML = h; const on = el.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' })
        }
        function openP() {
            if (!$('modal').hidden) closeM(); closePop(); P.q = ''; P.i = 0;
            $('pal').innerHTML = `<div class="pd" role="dialog" aria-modal="true" aria-label="Search"><div class="ph">${I.search}<input id="pq" data-in="pq" placeholder="Search cards, tags, boards, and actions" autocomplete="off" spellcheck="false" aria-label="Search"><kbd>Esc</kbd></div><div class="pl" id="pl" role="listbox"></div></div>`;
            $('pal').hidden = false; P.items = calc(); drawP(); $('pq').focus()
        }
        function closeP() { $('pal').hidden = true; $('pal').innerHTML = '' }
        function runP(i) {
            const x = P.items[i]; if (!x) return; closeP();
            if (x.t === 'board') { if (S.active !== x.id) ui.filter = null; S.active = x.id }
            else if (x.t === 'card') { S.active = x.b; ui.flash = x.id; ui.filter = null }
            else if (x.k === 'nb') { const nb = mk('Untitled board'); S.boards.push(nb); S.active = nb.id; ui.edit = nb.id; ui.focus = 1; ui.filter = null; S.collapsed = false }
            else if (x.k === 'nc') { const b = cur(); if (b) { ui.adding = b.cols[0].id; ui.closed[b.cols[0].id] = false; ui.focus = 1 } }
            else if (x.k === 'vw') S.view = S.view === 'board' ? 'list' : 'board';
            else if (x.k === 'tg') S.collapsed = !S.collapsed;
            save(); render()
        }
        document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('.pi'); if (!r || +r.dataset.i === P.i) return; P.i = +r.dataset.i; document.querySelectorAll('.pi.on').forEach(x => x.classList.remove('on')); r.classList.add('on') });
        render();
    </script>
</body>
